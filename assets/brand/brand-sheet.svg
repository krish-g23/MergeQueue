<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Merge Queue identity system</title>
  <desc id="description">A brand sheet showing the Merge Queue logo, color system, typography, and convergence motif.</desc>
  <rect width="1600" height="1000" fill="#F5F3EE"/>
  <path d="M64 58h1472M64 942h1472M997 58v884" stroke="#CECCC5"/>
  <text x="64" y="110" fill="#706E68" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="13" font-weight="700" letter-spacing="2.2">MERGE QUEUE / IDENTITY 01</text>
  <g transform="translate(64 174) scale(1.6)">
    <g fill="none" stroke-linecap="square" stroke-linejoin="round" stroke-width="5">
      <path d="M5 11h14c12 0 10 21 24 21" stroke="#1A1A1A"/>
      <path d="M5 32h38" stroke="#3157D5"/>
      <path d="M5 53h14c12 0 10-21 24-21" stroke="#1A1A1A"/>
      <path d="M43 32h14" stroke="#1A1A1A"/>
    </g>
    <circle cx="58" cy="32" r="5" fill="#E4552F"/>
  </g>
  <text x="64" y="420" fill="#1A1A1A" font-family="Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif" font-size="150" font-weight="600" letter-spacing="-9">MERGE</text>
  <text x="64" y="548" fill="#1A1A1A" font-family="Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif" font-size="150" font-weight="600" letter-spacing="-9">QUEUE</text>
  <text x="72" y="607" fill="#363532" font-family="Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="500">Concurrent work. One deliberate commit.</text>
  <g transform="translate(64 694)">
    <rect width="206" height="170" fill="#1A1A1A"/>
    <rect x="206" width="206" height="170" fill="#3157D5"/>
    <rect x="412" width="206" height="170" fill="#E4552F"/>
    <rect x="618" width="206" height="170" fill="#FFFFFF" stroke="#CECCC5"/>
    <g fill="#F5F3EE" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="12" font-weight="700" letter-spacing="1.3">
      <text x="18" y="28">INK</text><text x="18" y="147">#1A1A1A</text>
      <text x="224" y="28">AGENT</text><text x="224" y="147">#3157D5</text>
      <text x="430" y="28">FOCUS</text><text x="430" y="147">#E4552F</text>
    </g>
    <g fill="#1A1A1A" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="12" font-weight="700" letter-spacing="1.3">
      <text x="636" y="28">SURFACE</text><text x="636" y="147">#FFFFFF</text>
    </g>
  </g>
  <g transform="translate(1061 95)">
    <text fill="#706E68" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="12" font-weight="700" letter-spacing="2">THE MARK</text>
    <text y="58" fill="#1A1A1A" font-family="Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif" font-size="35" font-weight="600">Controlled convergence</text>
    <text y="101" fill="#706E68" font-family="Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif" font-size="18">Independent intent stays visible until</text>
    <text y="128" fill="#706E68" font-family="Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif" font-size="18">a human-reviewed commit resolves it.</text>
    <g transform="translate(0 210) scale(5)">
      <g fill="none" stroke-linecap="square" stroke-linejoin="round" stroke-width="2">
        <path d="M5 11h14c12 0 10 21 24 21" stroke="#1A1A1A"/>
        <path d="M5 32h38" stroke="#3157D5"/>
        <path d="M5 53h14c12 0 10-21 24-21" stroke="#1A1A1A"/>
        <path d="M43 32h14" stroke="#1A1A1A"/>
      </g>
      <circle cx="58" cy="32" r="2" fill="#E4552F"/>
    </g>
    <text y="560" fill="#706E68" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="12" font-weight="700" letter-spacing="2">TYPE</text>
    <text y="618" fill="#1A1A1A" font-family="Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif" font-size="45" font-weight="600" letter-spacing="-1.8">Avenir Next</text>
    <text y="661" fill="#706E68" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="16" letter-spacing="1">SF MONO / REVISION 014</text>
    <path d="M0 710h475" stroke="#CECCC5"/>
    <text y="758" fill="#1A1A1A" font-family="Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="600">Signal, don’t decorate.</text>
    <text y="790" fill="#706E68" font-family="Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif" font-size="16">Blue marks staged machine intent.</text>
    <text y="817" fill="#706E68" font-family="Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif" font-size="16">Orange marks attention and resolution.</text>
  </g>
</svg>
