[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; manifest-src 'self'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), tools=(self)"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
